<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Health-Hive</title>
    <link rel="stylesheet" href="sign-up.css">
    <script src="https://kit.fontawesome.com/f1001be9c4.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css"
		integrity="sha512-xh6O/CkQoPOWDdYTDqeRdPCVd1SpvCA9XXcUnZS2FmJNp1coAFzvtCN9BmamE+4aHK8yyUHUSCcJHgXloTyT2A=="
		crossorigin="anonymous" referrerpolicy="no-referrer"/>
</head>
<body>
    <div>
        <div class="logo">
           <a href="index.html"> <img src="./Media/images/new-logo-editted.png" alt="logo" /></a>
        </div>

        <div class="bordersection">
            <i class='fas fa-arrow-left' style='font-size:22px' onclick="window.history.back()"></i>
            <h1>Login to your account</h1>
            <p>
                Welcome back! Please enter your details.
            </p>
            <div class="form">
                <form action="Dashboard.html">
                    <label for="email">Email</label><br>
                    <input type="email" id="email" name="email"  autocomplete="on" required><br><br>
                    <label for="password">Password</label><br>
                    <i class="fa fa-eye" id="eye" aria-hidden="true"></i>
                    <input type="password" id="password" name="password"  autocomplete="off" required><br><br>
                    <input type="submit"  id= "button" value="Log In">
                </form>
                <strong>Don't have an account? <span style="color: #5034C8;"> <a href="sign-up.html">Sign Up </a> </span></strong>
            </div>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
